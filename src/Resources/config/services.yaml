services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Rwd\ContaoCustomArticlesBundle\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Resources,ContaoManager,Config,Template}'

    # Make the HexToRgba service public as it's used directly
    Rwd\ContaoCustomArticlesBundle\Library\HexToRgba:
        public: true
        
    # Configuration service
    Rwd\ContaoCustomArticlesBundle\Config\CustomArticlesConfig:
        arguments:
            $config: '%contao_custom_articles.config%'
            $enableBootstrap5: '%contao_custom_articles.enable_bootstrap5%'
            $includeBootstrapCdn: '%contao_custom_articles.include_bootstrap_cdn%'
            $enableCssGrid: '%contao_custom_articles.enable_css_grid%'
            $enableFlexbox: '%contao_custom_articles.enable_flexbox%'
            $enableDarkMode: '%contao_custom_articles.enable_dark_mode%'
            $spacing: '%contao_custom_articles.spacing%'
            $responsive: '%contao_custom_articles.responsive%'
        public: true
        
    # Template services
    Rwd\ContaoCustomArticlesBundle\Template\TemplateRegistry:
        public: true
        
    Rwd\ContaoCustomArticlesBundle\Template\TwigTemplateProxy:
        shared: false
        
    # Register Twig namespace for our templates
    Rwd\ContaoCustomArticlesBundle\EventSubscriber\TwigTemplateSubscriber:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['kernel.event_subscriber']
        
    # Register Bootstrap subscriber
    Rwd\ContaoCustomArticlesBundle\EventSubscriber\BootstrapSubscriber:
        tags: ['kernel.event_subscriber']
        
    # Alias for Twig Loader
    Twig\Loader\FilesystemLoader: '@twig.loader.native_filesystem'
    
    # Explicitly register the CompileArticleListener
    Rwd\ContaoCustomArticlesBundle\EventListener\CompileArticleListener:
        public: true
        tags:
            - { name: 'contao.hook', hook: 'compileArticle', priority: 0 }
            
    # Explicitly register the GetContentElementListener
    Rwd\ContaoCustomArticlesBundle\EventListener\GetContentElementListener:
        public: true
        tags:
            - { name: 'contao.hook', hook: 'getContentElement', priority: 0 }
            
    # The ParseTemplateListener is no longer used in Contao 5.x as the parseTemplate hook is deprecated
    # Functionality has been moved to GetContentElementListener
    # Rwd\ContaoCustomArticlesBundle\EventListener\ParseTemplateListener:
    #     public: true
    #     tags:
    #         - { name: 'contao.hook', hook: 'parseTemplate', priority: 0 }
